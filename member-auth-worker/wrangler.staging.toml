name = "alasas-fit-member-auth-staging"
main = "src/index.ts"
compatibility_date = "2026-10-16"

[[d1_databases]]
binding = "DB"
database_name = "alasas-fit-member-auth-staging"
database_id = "69f5c421-9969-47c0-a7ce-4e81d0ed0fdb"
migrations_dir = "migrations"

[vars]
DEPLOYMENT_ENV = "staging"
FIREBASE_PROJECT_ID = "alasas-fit-staging"
FIREBASE_DATABASE_URL = "https://alasas-fit-staging-default-rtdb.firebaseio.com"
PIN_HASH_ITERATIONS = "100000"
CUSTOM_TOKEN_TTL_SECONDS = "900"
ALLOWED_ORIGINS = "https://alasas-fit-staging.web.app,http://localhost:5173,http://127.0.0.1:5173"
ALLOWED_ADMIN_PROVIDERS = "google.com,password"

# Secrets are intentionally not stored here. Set with `wrangler secret put` only
# after the account and isolated staging project are explicitly authorized:
# FIREBASE_SERVICE_ACCOUNT_JSON, PIN_PEPPER
