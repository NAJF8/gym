<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f4f0" />
  <title>AL ASAS FIT</title>
  <style>
    #boot-status{font:14px Tahoma,Arial,sans-serif;max-width:560px;margin:12vh auto;padding:24px;border:1px solid #d9e2d9;border-radius:9px;background:white;color:#243a2c}
    #boot-status p{line-height:1.9}#boot-error{font:12px monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#f0f3ef;padding:12px}
    #boot-status button{padding:9px 16px;background:#294e42;color:white;border:0;border-radius:4px}
  </style>
</head>
<body style="background:#f4f4f0;margin:0">
  <div id="root">
    <div id="boot-status" role="status">
      <h2>AL ASAS FIT</h2><p>جاري تشغيل منصة التدريب…</p>
    </div>
  </div>
  <script>
    (function(){
      var lastError='';
      function reveal(message){
        lastError=message || 'Unknown startup error';
        var root=document.getElementById('root');
        if(!root || (root.querySelector && !root.querySelector('#boot-status')))return;
        var status=document.getElementById('boot-status');
        if(!status)return;
        status.innerHTML='';
        var heading=document.createElement('h2');heading.textContent='تعذر تشغيل التطبيق';
        var explanation=document.createElement('p');explanation.textContent='الصفحة وصلت لكن ملفات التطبيق أو JavaScript تعذّر تشغيلها. انسخ الخطأ وأرسله للدعم.';
        var error=document.createElement('pre');error.id='boot-error';error.textContent=lastError;
        var retry=document.createElement('button');retry.textContent='إعادة المحاولة';retry.onclick=function(){location.reload()};
        status.append(heading,explanation,error,retry);
      }
      window.addEventListener('error',function(e){reveal(e.message || ('Asset failed to load: '+(e.target && (e.target.src||e.target.href)||'')) )},true);
      window.addEventListener('unhandledrejection',function(e){reveal(String(e.reason && (e.reason.stack||e.reason.message) || e.reason))});
      window.setTimeout(function(){if(document.getElementById('boot-status'))reveal(lastError||'App did not mount within 8 seconds. Check the deployed JavaScript asset and browser Console.')},8000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
