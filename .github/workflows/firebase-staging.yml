name: AL ASAS FIT Staging - Firebase Hosting

on:
  push:
    branches: [codex/al-asas-fit-pin-staging-20261016]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run release security tests
        run: npm run test:pin && npm run test:video && npm run test:phone && npx -y firebase-tools@latest emulators:exec --only database --project demo-gym --non-interactive "npm run test:members && npm run test:rules"
      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Build staging bundle
        env:
          VITE_BASE_PATH: /
          VITE_RELEASE_ENVIRONMENT: staging
          VITE_RELEASE_COMMIT_SHA: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_PIN_SERVICE_ENDPOINT: ${{ vars.VITE_PIN_SERVICE_ENDPOINT }}
        run: npm run build:staging
      - name: Detect RTDB rules changes
        id: rules
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- database.rules.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy RTDB rules to Staging only
        if: steps.rules.outputs.changed == 'true'
        run: npx -y firebase-tools@latest deploy --only database --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}"
      - name: Apply reviewed Staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@latest d1 migrations apply alasas-fit-member-auth-staging --remote --config worker/wrangler.toml
      - name: Deploy Staging PIN Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@latest deploy --config worker/wrangler.toml
      - name: Deploy staging site
        run: npx -y firebase-tools@latest deploy --only hosting:alasas-fit-staging --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}"
      - name: Verify live Staging release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "https://alasas-fit-staging.web.app/release.json?verify=${GITHUB_RUN_ID}")"
          live_sha="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(value.commitSha || "")' <<<"$release")"
          test "$live_sha" = "$EXPECTED_SHA"
          root_headers="$(curl --fail --silent --show-error --retry 5 --retry-all-errors -D - -o /dev/null "https://alasas-fit-staging.web.app/?verify=${GITHUB_RUN_ID}")"
          grep -Fiq 'cache-control: no-cache, max-age=0, must-revalidate' <<<"$root_headers"
          index="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "https://alasas-fit-staging.web.app/?verify=${GITHUB_RUN_ID}")"
          css_path="$(node -e 'const fs=require("fs"); const html=fs.readFileSync(0,"utf8"); const match=html.match(/href="([^"]+\.css)"/); if (!match) process.exit(1); process.stdout.write(match[1])' <<<"$index")"
          js_path="$(node -e 'const fs=require("fs"); const html=fs.readFileSync(0,"utf8"); const match=html.match(/src="([^"]+\.js)"/); if (!match) process.exit(1); process.stdout.write(match[1])' <<<"$index")"
          css="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "https://alasas-fit-staging.web.app${css_path}?verify=${GITHUB_RUN_ID}")"
          js="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "https://alasas-fit-staging.web.app${js_path}?verify=${GITHUB_RUN_ID}")"
          grep -Fq 'margin:0 auto 20px' <<<"$css"
          grep -Fq 'Version 1.8.0' <<<"$js"
          grep -Fq 'حقوق محفوظة لشركة الأساس' <<<"$js"
