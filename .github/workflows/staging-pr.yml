name: AL ASAS FIT Staging PR Checks

on:
  pull_request:
    branches: [codex/al-asas-fit-pin-staging-20261016]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:pin && npm run test:video && npm run test:phone
      - run: npx --yes firebase-tools@15.34.2 emulators:exec --only database --project demo-gym --non-interactive "npm run test:members && npm run test:rules"
      - name: Build Staging bundle
        env:
          VITE_BASE_PATH: /
          VITE_RELEASE_ENVIRONMENT: staging
          VITE_RELEASE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_PIN_SERVICE_ENDPOINT: ${{ vars.VITE_PIN_SERVICE_ENDPOINT }}
        run: npm run build:staging
      - name: Compile Staging PIN Worker
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config worker/wrangler.toml
