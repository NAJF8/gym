name: AL ASAS FIT Production - Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run release security tests
        run: npm run test:pin && npm run test:video && npm run test:invites && npx -y firebase-tools@latest emulators:exec --only database --project demo-gym --non-interactive "npm run test:rules"
      - name: Compile Production Worker contract
        run: npx -y wrangler@latest deploy --dry-run --config worker/wrangler.production.toml
      - name: Build production bundle
        env:
          VITE_BASE_PATH: /
          VITE_RELEASE_ENVIRONMENT: production
          VITE_RELEASE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || '' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_PIN_SERVICE_ENDPOINT: ${{ vars.VITE_PIN_SERVICE_ENDPOINT }}
        run: npm run build:production
      - name: Detect RTDB rules changes
        id: rules
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- database.rules.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy RTDB rules to Production
        if: steps.rules.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GYM1_4F1BB }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > sa.json
          GOOGLE_APPLICATION_CREDENTIALS=sa.json npx -y firebase-tools@latest deploy --only database --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f sa.json
      - name: Deploy Production PIN Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@latest deploy --config worker/wrangler.production.toml
      - name: Verify production deployment target and artifact
        run: npm run verify:deployment:production
      - name: Deploy Firebase Hosting production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GYM1_4F1BB }}
          channelId: live
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      - name: Verify live production bundle and environment isolation
        run: npm run verify:live:production
